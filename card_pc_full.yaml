                  st_col = '#34c759';
                } else if (status === 'ĐANG DỪNG') {
                  st_col = '#ff9f0a';
                } else if (status === 'ĐANG ĐÓNG' || status === 'ĐÃ ĐÓNG') {
                  st_col = '#5ac8fa';
                }

                return `
                  <div style="border: 2px solid ${st_col}; border-radius: 999px; padding: 6px 24px; box-shadow: 0 0 14px ${st_col}60; background: rgba(0,0,0,0.3); display: inline-flex; align-items: center; justify-content: center;">
                    <span style="font-size: 15.5px; font-weight: 900; color: ${st_col}; letter-spacing: 0.8px; line-height: 1;">${st_text}</span>
                  </div>
                `;
              ]]]
            controls:
              card:
                type: grid
                columns: 3
                square: false
                cards:
                  # NÚT MỞ (XANH LÁ)
                  - type: custom:button-card
