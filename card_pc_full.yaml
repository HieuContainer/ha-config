          name: Nóng Lạnh
          show_name: false
          show_icon: false
          show_state: false
          update_timer: 1s
          triggers_update:
            - switch.cong_tac_nong_lanh
            - timer.nong_lanh_20_phut
          tap_action:
            action: toggle
          hold_action:
            action: more-info
          styles:
            card:
              - height: 261px
              - background-color: "#14171a"
              - border-radius: 18px
              - border: |
                  [[[
                    if (entity.state === 'on') return '1px solid rgba(255, 69, 58, 0.4)';
                    return '1px solid rgba(255, 255, 255, 0.1)';
                  ]]]
