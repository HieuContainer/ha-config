                    </div>
                  </div>
                `;
              ]]]
            status: |
              [[[
                const status = states['input_select.trang_thai_cua']?.state || 'ĐANG DỪNG';
                var is_unav = entity.state === 'unavailable';

                var st_text = is_unav ? 'MẤT KẾT NỐI' : status;
