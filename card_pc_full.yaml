              [[[
                var is_on = entity.state === 'on';
                var is_unav = entity.state === 'unavailable';
                var wifi_col = is_unav ? '#ff453a' : '#25d366';
                var wifi_icon = is_unav ? 'mdi:wifi-off' : 'mdi:wifi';
                var wifi_text = is_unav ? 'Offline' : 'Online';
                var wifi_bg = is_unav ? 'rgba(255,69,58,0.12)' : 'rgba(37,211,102,0.12)';

                return `
                  <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                    <div style="display:flex; align-items:center; gap:6px; min-width:0;">
                      <div style="width:30px; height:30px; border-radius:8px; background:${is_on ? 'rgba(255,69,58,0.2)' : 'rgba(255,255,255,0.06)'}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                        <ha-icon icon="mdi:water-boiler" style="--mdc-icon-size:19px; color:${is_on ? '#ff453a' : '#8e8e93'};"></ha-icon>
                      </div>
                      <span style="font-size:14.5px; font-weight:900; color:#fff; white-space:nowrap;">Nóng Lạnh</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:4px; font-size:10px; font-weight:800; color:${wifi_col}; background:${wifi_bg}; padding:2.5px 6px; border-radius:6px; border:1px solid ${wifi_col}; white-space:nowrap; flex-shrink:0;">
                      <ha-icon icon="${wifi_icon}" style="--mdc-icon-size:11.5px; color:${wifi_col};"></ha-icon>
                      <span>${wifi_text}</span>
                    </div>
                  </div>
                `;
              ]]]
            gauge: |
              [[[
                const sw = states['switch.cong_tac_nong_lanh'];
                const timer = states['timer.nong_lanh_20_phut'];
                var is_on = sw?.state === 'on';

                var totalSec = 1200;
                var remainSec = 0;
                var time_str = '--:--';
                var percent = 0;

                if (is_on) {
                  if (timer && timer.state === 'active' && timer.attributes.finishes_at) {
                    remainSec = Math.max(0, Math.ceil((new Date(timer.attributes.finishes_at).getTime() - Date.now()) / 1000));
                    var min = Math.floor(remainSec / 60);
                    var sec = remainSec % 60;
                    time_str = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
                    percent = (remainSec / totalSec) * 100;
                  } else {
                    time_str = '20:00';
                    percent = 100;
                  }
                }

                var strokeDash = (percent * 163.3) / 100;
                var ringColor = is_on ? '#ff453a' : 'rgba(255,255,255,0.06)';

                return `
                  <div style="position:relative; width:96px; height:96px; display:flex; align-items:center; justify-content:center; margin:auto;">
