- type: sections
  background:
    opacity: 33
    alignment: center
    size: cover
    repeat: repeat
    attachment: fixed
    image:
      media_content_id: media-source://image_upload/04384d8d6ea2e933e4ff30f4e3d68c2f
      media_content_type: image/jpeg
      metadata:
        title: pexels-lorenzo-castellino-61076802-33229948.jpg
        thumbnail: /api/image/serve/04384d8d6ea2e933e4ff30f4e3d68c2f/256x256
        media_class: image
        navigateIds:
        - {}
        - media_content_type: app
          media_content_id: media-source://image_upload
  sections:
  - type: grid
    cards:
    - type: vertical-stack
      cards:
        # ==========================================
        # 1. 4 THẺ NGUỒN (LƯỚI 2x2 VUÔNG VẮN CÂN XỨNG)
        # ==========================================
        - type: grid
          columns: 2
          square: false
          cards:
            # 1. ÔNG MẶT TRỜI
            - type: custom:button-card
              show_icon: false
              show_name: false
              show_state: false
              show_label: false
              styles:
                card:
                  - height: 185px
                  - background-color: '#15201a'
                  - border: 1px solid rgba(37, 211, 102, 0.25)
                  - border-radius: 18px
                  - padding: 12px
                  - color: '#ffffff'
                  - box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35)
                grid:
                  - grid-template-areas: '"content"'
                  - grid-template-columns: 1fr
                custom_fields:
                  content:
                    - width: 100%
                    - height: 100%
              custom_fields:
                content: |
                  [[[
                    var p_today = (states['sensor.luxpower_inverter_pv_pv_energy_today'] && states['sensor.luxpower_inverter_pv_pv_energy_today'].state != 'unavailable') ? states['sensor.luxpower_inverter_pv_pv_energy_today'].state : '0.0';
                    var p_total = (states['sensor.pv_energy_monthly'] && states['sensor.pv_energy_monthly'].state != 'unavailable' && states['sensor.pv_energy_monthly'].state != 'unknown') ? states['sensor.pv_energy_monthly'].state : ((states['sensor.luxpower_inverter_pv_pv_energy_total'] && states['sensor.luxpower_inverter_pv_pv_energy_total'].state != 'unavailable') ? states['sensor.luxpower_inverter_pv_pv_energy_total'].state : '0.0');
                    var p_power = (states['sensor.luxpower_inverter_pv_pv_power'] && states['sensor.luxpower_inverter_pv_pv_power'].state != 'unavailable') ? states['sensor.luxpower_inverter_pv_pv_power'].state : '0';
                    var p_volt = (states['sensor.luxpower_inverter_pv_pv1_voltage'] && states['sensor.luxpower_inverter_pv_pv1_voltage'].state != 'unavailable') ? states['sensor.luxpower_inverter_pv_pv1_voltage'].state : '0.0';
                    var p_curr = (states['sensor.luxpower_inverter_pv_pv1_current'] && states['sensor.luxpower_inverter_pv_pv1_current'].state != 'unavailable') ? states['sensor.luxpower_inverter_pv_pv1_current'].state : '0.0';
                    var is_gen = parseFloat(p_power) > 5;

                    var p_val = parseFloat(p_total) || 0;
                    var cost = 0;
                    if (p_val <= 50) {
                      cost = p_val * 1984;
                    } else if (p_val <= 100) {
                      cost = 50 * 1984 + (p_val - 50) * 2050;
                    } else if (p_val <= 200) {
                      cost = 50 * 1984 + 50 * 2050 + (p_val - 100) * 2380;
                    } else if (p_val <= 300) {
                      cost = 50 * 1984 + 50 * 2050 + 100 * 2380 + (p_val - 200) * 2998;
                    } else if (p_val <= 400) {
                      cost = 50 * 1984 + 50 * 2050 + 100 * 2380 + 100 * 2998 + (p_val - 300) * 3350;
                    } else {
                      cost = 50 * 1984 + 50 * 2050 + 100 * 2380 + 100 * 2998 + 100 * 3350 + (p_val - 400) * 3460;
                    }
                    var p_money = Math.round(cost).toLocaleString('vi-VN');

                    return `
                      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%; width: 100%; box-sizing: border-box;">
                        <div>
                          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; width: 100%;">
                            <div style="display: flex; align-items: center; gap: 6px; background: rgba(37,211,102,0.15); padding: 4px 8px; border-radius: 10px; color: #25d366; font-weight: 800; font-size: 11px;">
                              <ha-icon icon="mdi:weather-sunny" style="--mdc-icon-size: 15px; color: #25d366;"></ha-icon> ÔNG MẶT TRỜI
                            </div>
                            <ha-icon icon="mdi:solar-power" style="--mdc-icon-size: 24px; color: #25d366; opacity: 0.6;"></ha-icon>
                          </div>

                          <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 4px; margin-bottom: 6px; width: 100%;">
                            <div style="text-align: center;">
                              <div style="font-size: 9px; color: #81b89a; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px;">
                                <span style="height: 5px; width: 5px; background-color: #25d366; border-radius: 50%; display: inline-block; box-shadow: 0 0 5px #25d366;"></span> HÔM NAY
                              </div>
                              <div style="font-size: 22px; font-weight: 800; color: #fff; margin-top: 2px; line-height: 1.1;">${p_today}</div>
                              <div style="font-size: 10px; color: #aaa; margin-top: 1px;">kWh</div>
                            </div>

                            <div style="width: 1px; height: 36px; background: rgba(255,255,255,0.12);"></div>

                            <div style="text-align: center;">
                              <div style="font-size: 9px; color: #81b89a; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px;">
                                <span style="height: 5px; width: 5px; background-color: #25d366; border-radius: 50%; display: inline-block;"></span> THÁNG NÀY
                              </div>
                              <div style="font-size: 22px; font-weight: 800; color: #fff; margin-top: 2px; line-height: 1.1;">${p_total}</div>
                              <div style="font-size: 10px; color: #aaa; margin-top: 1px;">kWh</div>
                              <div style="font-size: 10.5px; color: #25d366; font-weight: 700; margin-top: 2px;">~${p_money} đ</div>
                            </div>
                          </div>
                        </div>

                        <div style="background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 5px 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; width: 100%; box-sizing: border-box;">
                          <div style="display: flex; justify-content: center; align-items: center; gap: 8px;">
                            <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #fff;">
                              <span style="height: 7px; width: 7px; background-color: ${is_gen ? '#25d366' : '#555'}; border-radius: 50%; display: inline-block; box-shadow: ${is_gen ? '0 0 6px #25d366' : 'none'};"></span>
                              Đang Phát:
                            </div>
                            <div style="font-size: 16px; font-weight: 800; color: #25d366;">${p_power} <span style="font-size: 10px; font-weight: 400; color: #aaa;">W</span></div>
                          </div>

                          <div style="font-size: 10px; color: #81b89a; font-weight: 600; display: flex; align-items: center; gap: 4px;">
                            <ha-icon icon="mdi:flash" style="--mdc-icon-size: 12px; color: #25d366;"></ha-icon>
                            Áp PV1: <span style="color: #fff; font-weight: 800;">${p_volt} V</span>
                          </div>

                          <div style="font-size: 10px; color: #81b89a; font-weight: 600; display: flex; align-items: center; gap: 4px;">
                            <ha-icon icon="mdi:current-ac" style="--mdc-icon-size: 12px; color: #25d366;"></ha-icon>
                            Dòng PV1: <span style="color: #fff; font-weight: 800;">${p_curr} A</span>
                          </div>
                        </div>
                      </div>
                    `;
                  ]]]

            # 2. PIN LƯU TRỮ
            - type: custom:button-card
              show_icon: false
              show_name: false
              show_state: false
              show_label: false
              styles:
                card:
                  - height: 185px
                  - background-color: '#1e1828'
                  - border: 1px solid rgba(188, 82, 255, 0.25)
                  - border-radius: 18px
                  - padding: 12px
                  - color: '#ffffff'
                  - box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35)
                grid:
                  - grid-template-areas: '"content"'
                  - grid-template-columns: 1fr
                custom_fields:
                  content:
                    - width: 100%
                    - height: 100%
              custom_fields:
                content: |
                  [[[
                    var soc = (states['sensor.luxpower_inverter_battery_battery_soc'] && states['sensor.luxpower_inverter_battery_battery_soc'].state != 'unavailable' && states['sensor.luxpower_inverter_battery_battery_soc'].state != 'unknown') ? states['sensor.luxpower_inverter_battery_battery_soc'].state : '0';
                    var b_power = (states['sensor.luxpower_inverter_battery_battery_power'] && states['sensor.luxpower_inverter_battery_battery_power'].state != 'unavailable' && states['sensor.luxpower_inverter_battery_battery_power'].state != 'unknown') ? states['sensor.luxpower_inverter_battery_battery_power'].state : '0';
                    var b_chg_today = (states['sensor.luxpower_inverter_battery_charge_energy_today'] && states['sensor.luxpower_inverter_battery_charge_energy_today'].state != 'unavailable' && states['sensor.luxpower_inverter_battery_charge_energy_today'].state != 'unknown') ? states['sensor.luxpower_inverter_battery_charge_energy_today'].state : '0.0';
                    var b_chg_total = (states['sensor.battery_charge_monthly'] && states['sensor.battery_charge_monthly'].state != 'unavailable' && states['sensor.battery_charge_monthly'].state != 'unknown') ? states['sensor.battery_charge_monthly'].state : ((states['sensor.luxpower_inverter_battery_charge_energy_total'] && states['sensor.luxpower_inverter_battery_charge_energy_total'].state != 'unavailable' && states['sensor.luxpower_inverter_battery_charge_energy_total'].state != 'unknown') ? states['sensor.luxpower_inverter_battery_charge_energy_total'].state : '0.0');
                    var b_dis_today = (states['sensor.luxpower_inverter_battery_discharge_energy_today'] && states['sensor.luxpower_inverter_battery_discharge_energy_today'].state != 'unavailable' && states['sensor.luxpower_inverter_battery_discharge_energy_today'].state != 'unknown') ? states['sensor.luxpower_inverter_battery_discharge_energy_today'].state : '0.0';
                    var b_dis_total = (states['sensor.battery_discharge_monthly'] && states['sensor.battery_discharge_monthly'].state != 'unavailable' && states['sensor.battery_discharge_monthly'].state != 'unknown') ? states['sensor.battery_discharge_monthly'].state : ((states['sensor.luxpower_inverter_battery_discharge_energy_total'] && states['sensor.luxpower_inverter_battery_discharge_energy_total'].state != 'unavailable' && states['sensor.luxpower_inverter_battery_discharge_energy_total'].state != 'unknown') ? states['sensor.luxpower_inverter_battery_discharge_energy_total'].state : '0.0');

                    return `
                      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%; width: 100%; box-sizing: border-box;">
                        <div>
                          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; width: 100%;">
                            <div style="display: flex; align-items: center; gap: 6px; background: rgba(209,158,255,0.15); padding: 4px 8px; border-radius: 10px; color: #d19eff; font-weight: 800; font-size: 11px;">
                              <ha-icon icon="mdi:battery-charging" style="--mdc-icon-size: 15px; color: #d19eff;"></ha-icon> PIN LƯU TRỮ
                            </div>
                            <ha-icon icon="mdi:battery-high" style="--mdc-icon-size: 24px; color: #d19eff; opacity: 0.6;"></ha-icon>
                          </div>

                          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                            <div style="background: rgba(255, 255, 255, 0.04); border-radius: 10px; padding: 4px 6px; border: 1px solid rgba(209,158,255,0.12); text-align: center;">
                              <div style="font-size: 8px; color: #d19eff; font-weight: 800;">SẠC HÔM NAY</div>
                              <div style="font-size: 16px; font-weight: 800; color: #fff; margin-top: 1px;">${b_chg_today} <span style="font-size: 9px; color: #aaa; font-weight: 400;">kWh</span></div>
                              <div style="font-size: 8px; color: #777888; margin-top: 1px;">Tháng này: <span style="color:#aaa;">${b_chg_total} kWh</span></div>
                            </div>

                            <div style="background: rgba(255, 255, 255, 0.04); border-radius: 10px; padding: 4px 6px; border: 1px solid rgba(209,158,255,0.12); text-align: center;">
                              <div style="font-size: 8px; color: #d19eff; font-weight: 800;">XẢ HÔM NAY</div>
                              <div style="font-size: 16px; font-weight: 800; color: #fff; margin-top: 1px;">${b_dis_today} <span style="font-size: 9px; color: #aaa; font-weight: 400;">kWh</span></div>
                              <div style="font-size: 8px; color: #777888; margin-top: 1px;">Tháng này: <span style="color:#aaa;">${b_dis_total} kWh</span></div>
                            </div>
                          </div>
                        </div>

                        <div style="background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 7px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; box-sizing: border-box;">
                          <div style="flex: 1; background: #2f1b42; height: 8px; border-radius: 4px; overflow: hidden;">
                            <div style="width: ${soc}%; background: linear-gradient(90deg, #6c2bd9, #bc52ff); height: 100%; border-radius: 4px;"></div>
                          </div>
                          <div style="font-size: 17px; font-weight: 800; color: #d19eff;">${soc}%</div>
                        </div>
                      </div>
                    `;
                  ]]]

            # 3. ĐIỆN LƯỚI
            - type: custom:button-card
              show_icon: false
              show_name: false
              show_state: false
              show_label: false
              styles:
                card:
                  - height: 185px
                  - background-color: '#141e2a'
                  - border: 1px solid rgba(74, 144, 226, 0.25)
                  - border-radius: 18px
                  - padding: 12px
                  - color: '#ffffff'
                  - box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35)
                grid:
                  - grid-template-areas: '"content"'
                  - grid-template-columns: 1fr
                custom_fields:
                  content:
                    - width: 100%
                    - height: 100%
              custom_fields:
                content: |
                  [[[
                    var g_imp_p = (states['sensor.luxpower_inverter_grid_power_from_grid'] && states['sensor.luxpower_inverter_grid_power_from_grid'].state != 'unavailable' && states['sensor.luxpower_inverter_grid_power_from_grid'].state != 'unknown') ? states['sensor.luxpower_inverter_grid_power_from_grid'].state : '0';
                    var g_imp_today = (states['sensor.luxpower_inverter_grid_energy_from_grid_today'] && states['sensor.luxpower_inverter_grid_energy_from_grid_today'].state != 'unavailable' && states['sensor.luxpower_inverter_grid_energy_from_grid_today'].state != 'unknown') ? states['sensor.luxpower_inverter_grid_energy_from_grid_today'].state : '0.0';
                    var g_imp_month = (states['sensor.grid_energy_monthly'] && states['sensor.grid_energy_monthly'].state != 'unavailable' && states['sensor.grid_energy_monthly'].state != 'unknown') ? states['sensor.grid_energy_monthly'].state : ((states['sensor.luxpower_inverter_grid_energy_from_grid_total'] && states['sensor.luxpower_inverter_grid_energy_from_grid_total'].state != 'unavailable' && states['sensor.luxpower_inverter_grid_energy_from_grid_total'].state != 'unknown') ? states['sensor.luxpower_inverter_grid_energy_from_grid_total'].state : '0.0');

                    var g_val = parseFloat(g_imp_month) || 0;
                    var cost = 0;
                    if (g_val <= 50) {
                      cost = g_val * 1984;
                    } else if (g_val <= 100) {
                      cost = 50 * 1984 + (g_val - 50) * 2050;
                    } else if (g_val <= 200) {
                      cost = 50 * 1984 + 50 * 2050 + (g_val - 100) * 2380;
                    } else if (g_val <= 300) {
                      cost = 50 * 1984 + 50 * 2050 + 100 * 2380 + (g_val - 200) * 2998;
                    } else if (g_val <= 400) {
                      cost = 50 * 1984 + 50 * 2050 + 100 * 2380 + 100 * 2998 + (g_val - 300) * 3350;
                    } else {
                      cost = 50 * 1984 + 50 * 2050 + 100 * 2380 + 100 * 2998 + 100 * 3350 + (g_val - 400) * 3460;
                    }
                    var g_money = Math.round(cost).toLocaleString('vi-VN');

                    return `
                      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%; width: 100%; box-sizing: border-box;">
                        <div>
                          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; width: 100%;">
                            <div style="display: flex; align-items: center; gap: 6px; background: rgba(74,144,226,0.15); padding: 4px 8px; border-radius: 10px; color: #4a90e2; font-weight: 800; font-size: 11px;">
                              <ha-icon icon="mdi:transmission-tower" style="--mdc-icon-size: 15px; color: #4a90e2;"></ha-icon> ĐIỆN LƯỚI
                            </div>
                            <ha-icon icon="mdi:transmission-tower" style="--mdc-icon-size: 26px; color: #4a90e2; opacity: 0.8;"></ha-icon>
                          </div>

                          <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 6px; margin-bottom: 8px; width: 100%;">
                            <div style="text-align: center;">
                              <div style="font-size: 9px; color: #6ba4e8; font-weight: 800;">HÔM NAY</div>
                              <div style="font-size: 20px; font-weight: 800; color: #fff; margin-top: 2px; line-height: 1.1;">${g_imp_today}</div>
                              <div style="font-size: 10px; color: #aaa; margin-top: 1px;">kWh</div>
                            </div>

                            <div style="width: 1px; height: 42px; background: rgba(255,255,255,0.12);"></div>

                            <div style="text-align: center;">
                              <div style="font-size: 9px; color: #6ba4e8; font-weight: 800;">THÁNG NÀY</div>
                              <div style="font-size: 20px; font-weight: 800; color: #fff; margin-top: 2px; line-height: 1.1;">${g_imp_month}</div>
                              <div style="font-size: 10px; color: #aaa; margin-top: 1px;">kWh</div>
                              <div style="font-size: 11px; color: #64b5f6; font-weight: 700; margin-top: 10px;">~${g_money} đ</div>
                            </div>
                          </div>
                        </div>

                        <div style="background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 7px 12px; display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; box-sizing: border-box;">
                          <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #fff;">
                            <span style="height: 7px; width: 7px; background-color: #4a90e2; border-radius: 50%; box-shadow: 0 0 6px #4a90e2;"></span>
                            Đang Mua:
                          </div>
                          <div style="font-size: 17px; font-weight: 800; color: #4a90e2;">${g_imp_p} <span style="font-size: 11px; font-weight: 400; color: #aaa;">W</span></div>
                        </div>
                      </div>
                    `;
                  ]]]

            # 4. TIÊU THỤ
            - type: custom:button-card
              show_icon: false
              show_name: false
              show_state: false
              show_label: false
              styles:
                card:
                  - height: 185px
                  - background-color: '#231814'
                  - border: 1px solid rgba(255, 87, 34, 0.25)
                  - border-radius: 18px
                  - padding: 12px
                  - color: '#ffffff'
                  - box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35)
                grid:
                  - grid-template-areas: '"content"'
                  - grid-template-columns: 1fr
                custom_fields:
                  content:
                    - width: 100%
                    - height: 100%
              custom_fields:
                content: |
                  [[[
                    var p_today = parseFloat((states['sensor.luxpower_inverter_pv_pv_energy_today'] && states['sensor.luxpower_inverter_pv_pv_energy_today'].state != 'unavailable') ? states['sensor.luxpower_inverter_pv_pv_energy_today'].state : '0');
                    var g_imp_today = parseFloat((states['sensor.luxpower_inverter_grid_energy_from_grid_today'] && states['sensor.luxpower_inverter_grid_energy_from_grid_today'].state != 'unavailable') ? states['sensor.luxpower_inverter_grid_energy_from_grid_today'].state : '0');
                    var l_today = (p_today + g_imp_today).toFixed(1);

                    var p_total = parseFloat((states['sensor.pv_energy_monthly'] && states['sensor.pv_energy_monthly'].state != 'unavailable' && states['sensor.pv_energy_monthly'].state != 'unknown') ? states['sensor.pv_energy_monthly'].state : ((states['sensor.luxpower_inverter_pv_pv_energy_total'] && states['sensor.luxpower_inverter_pv_pv_energy_total'].state != 'unavailable') ? states['sensor.luxpower_inverter_pv_pv_energy_total'].state : '0'));
                    var g_imp_month = parseFloat((states['sensor.grid_energy_monthly'] && states['sensor.grid_energy_monthly'].state != 'unavailable' && states['sensor.grid_energy_monthly'].state != 'unknown') ? states['sensor.grid_energy_monthly'].state : ((states['sensor.luxpower_inverter_grid_energy_from_grid_total'] && states['sensor.luxpower_inverter_grid_energy_from_grid_total'].state != 'unavailable') ? states['sensor.luxpower_inverter_grid_energy_from_grid_total'].state : '0'));
                    var l_total = (p_total + g_imp_month).toFixed(1);

                    var k_val = parseFloat(l_total) || 0;
                    var cost = 0;
                    if (k_val <= 50) {
                      cost = k_val * 1984;
                    } else if (k_val <= 100) {
                      cost = 50 * 1984 + (k_val - 50) * 2050;
                    } else if (k_val <= 200) {
                      cost = 50 * 1984 + 50 * 2050 + (k_val - 100) * 2380;
                    } else if (k_val <= 300) {
                      cost = 50 * 1984 + 50 * 2050 + 100 * 2380 + (k_val - 200) * 2998;
                    } else if (k_val <= 400) {
                      cost = 50 * 1984 + 50 * 2050 + 100 * 2380 + 100 * 2998 + (k_val - 300) * 3350;
                    } else {
                      cost = 50 * 1984 + 50 * 2050 + 100 * 2380 + 100 * 2998 + 100 * 3350 + (k_val - 400) * 3460;
                    }
                    var l_money = Math.round(cost).toLocaleString('vi-VN');

                    var l_power = (states['sensor.luxpower_inverter_load_power'] && states['sensor.luxpower_inverter_load_power'].state != 'unavailable') ? states['sensor.luxpower_inverter_load_power'].state : '0';

                    return `
                      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%; width: 100%; box-sizing: border-box;">
                        <div>
                          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; width: 100%;">
                            <div style="display: flex; align-items: center; gap: 6px; background: rgba(255,87,34,0.15); padding: 4px 8px; border-radius: 10px; color: #ff5722; font-weight: 800; font-size: 11px;">
                              <ha-icon icon="mdi:home-lightning-bolt" style="--mdc-icon-size: 15px; color: #ff5722;"></ha-icon> TIÊU THỤ
                            </div>
                            <ha-icon icon="mdi:home" style="--mdc-icon-size: 26px; color: #ff5722; opacity: 0.8;"></ha-icon>
                          </div>

                          <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 6px; margin-bottom: 8px; width: 100%;">
                            <div style="text-align: center;">
                              <div style="font-size: 9px; color: #b38575; font-weight: 800;">HÔM NAY</div>
                              <div style="font-size: 20px; font-weight: 800; color: #fff; margin-top: 2px; line-height: 1.1;">${l_today}</div>
                              <div style="font-size: 10px; color: #aaa; margin-top: 1px;">kWh</div>
                            </div>

                            <div style="width: 1px; height: 42px; background: rgba(255,255,255,0.12);"></div>

                            <div style="text-align: center;">
                              <div style="font-size: 9px; color: #b38575; font-weight: 800;">THÁNG NÀY</div>
                              <div style="font-size: 20px; font-weight: 800; color: #fff; margin-top: 2px; line-height: 1.1;">${l_total}</div>
                              <div style="font-size: 10px; color: #aaa; margin-top: 1px;">kWh</div>
                              <div style="font-size: 11px; color: #ffb74d; font-weight: 700; margin-top: 10px;">~${l_money} đ</div>
                            </div>
                          </div>
                        </div>

                        <div style="background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 7px 12px; display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; box-sizing: border-box;">
                          <div style="font-size: 11px; font-weight: 600; color: #d0a495;">Công Suất Hiện Tại:</div>
                          <div style="font-size: 17px; font-weight: 800; color: #ff5722;">${l_power} <span style="font-size: 11px; font-weight: 400; color: #aaa;">W</span></div>
                        </div>
                      </div>
                    `;
                  ]]]

        # ==========================================
        # 2. BỘ ĐÔI THẺ SẠC LƯỚI & XẢ PIN (THEO GIỜ)
        # ==========================================
        - type: grid
          columns: 2
          square: false
          cards:
            # A. THẺ SẠC TỪ LƯỚI (AC CHARGE)
            - type: custom:stack-in-card
              card_mod:
                style: |
                  ha-card {
                    background: #141a24 !important;
                    border-radius: 18px !important;
                    border: 1px solid rgba(74, 144, 226, 0.25) !important;
                    padding: 12px 14px !important;
                    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
                  }
              cards:
                - type: custom:button-card
                  show_icon: false
                  show_name: false
                  show_state: false
                  styles:
                    card:
                      - background: none
                      - border: none
                      - box-shadow: none
                      - padding: "0px"
                    grid:
                      - grid-template-areas: '"content"'
                      - grid-template-columns: 1fr
                    custom_fields:
                      content:
                        - width: 100%
                  custom_fields:
                    content: |
                      [[[
                        var p_chg = (states['sensor.luxpower_inverter_battery_battery_charge_power'] && states['sensor.luxpower_inverter_battery_battery_charge_power'].state != 'unavailable') ? states['sensor.luxpower_inverter_battery_battery_charge_power'].state : '0';
                        var i_ac = (states['number.luxpower_inverter_battery_ac_charge_current_from_grid'] && states['number.luxpower_inverter_battery_ac_charge_current_from_grid'].state != 'unavailable') ? states['number.luxpower_inverter_battery_ac_charge_current_from_grid'].state : '0';
                        return `
                          <div style="width: 100%; margin-bottom: 8px;">
                            <div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: #4a90e2; margin-bottom: 8px; letter-spacing: 0.3px;">
                              <ha-icon icon="mdi:transmission-tower-import" style="--mdc-icon-size: 18px; color: #4a90e2;"></ha-icon>
                              <span>SẠC TỪ LƯỚI (AC CHARGE)</span>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(74, 144, 226, 0.2); border-radius: 12px; padding: 7px 10px; text-align: center;">
                              <div>
                                <div style="font-size: 8.5px; color: #78a6db; font-weight: 700; text-transform: uppercase;">CÔNG SUẤT SẠC</div>
                                <div style="font-size: 15px; font-weight: 900; color: #00ffcc; margin-top: 2px;">${p_chg} <span style="font-size: 9.5px; color: #888;">W</span></div>
                              </div>
                              <div style="border-left: 1px solid rgba(255, 255, 255, 0.1);">
                                <div style="font-size: 8.5px; color: #78a6db; font-weight: 700; text-transform: uppercase;">DÒNG SẠC</div>
                                <div style="font-size: 15px; font-weight: 900; color: #00ffcc; margin-top: 2px;">${i_ac} <span style="font-size: 9.5px; color: #888;">A</span></div>
                              </div>
                            </div>
                          </div>
                        `;
                      ]]]
                - type: entities
                  card_mod:
                    style: |
                      ha-card {
                        background: none !important;
                        border: none !important;
                        box-shadow: none !important;
                        padding: 0px !important;
                      }
                      .card-content {
                        padding: 0px !important;
                      }
                      hui-generic-entity-row {
                        padding: 3px 0px !important;
                      }
                  entities:
                    - entity: input_boolean.solar_ac_charge_enabled
                      name: Kích hoạt sạc lưới
                      icon: mdi:battery-charging-wireless-outline
                    - entity: number.luxpower_inverter_battery_ac_charge_current_from_grid
                      name: Dòng sạc lưới
                      icon: mdi:current-ac
                    - entity: input_datetime.solar_ac_charge_start
                      name: Giờ bắt đầu sạc
                      icon: mdi:clock-start
                    - entity: input_datetime.solar_ac_charge_end
                      name: Giờ kết thúc sạc
                      icon: mdi:clock-end
                    - entity: input_number.solar_ac_charge_soc_limit
                      name: Ngưỡng dừng sạc
                      icon: mdi:battery-charging-90

            # B. THẺ XẢ PIN / CẤP TẢI (DISCHARGE)
            - type: custom:stack-in-card
              card_mod:
                style: |
                  ha-card {
                    background: #1e1828 !important;
                    border-radius: 18px !important;
                    border: 1px solid rgba(188, 82, 255, 0.25) !important;
                    padding: 12px 14px !important;
                    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
                  }
              cards:
                - type: custom:button-card
                  show_icon: false
                  show_name: false
                  show_state: false
                  styles:
                    card:
                      - background: none
                      - border: none
                      - box-shadow: none
                      - padding: "0px"
                    grid:
                      - grid-template-areas: '"content"'
                      - grid-template-columns: 1fr
                    custom_fields:
                      content:
                        - width: 100%
                  custom_fields:
                    content: |
                      [[[
                        var p_dis = (states['sensor.luxpower_inverter_battery_battery_discharge_power'] && states['sensor.luxpower_inverter_battery_battery_discharge_power'].state != 'unavailable') ? states['sensor.luxpower_inverter_battery_battery_discharge_power'].state : '0';
                        var soc = (states['sensor.luxpower_inverter_battery_battery_soc'] && states['sensor.luxpower_inverter_battery_battery_soc'].state != 'unavailable') ? states['sensor.luxpower_inverter_battery_battery_soc'].state : '0';
                        return `
                          <div style="width: 100%; margin-bottom: 8px;">
                            <div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: #bc52ff; margin-bottom: 8px; letter-spacing: 0.3px;">
                              <ha-icon icon="mdi:battery-arrow-down" style="--mdc-icon-size: 18px; color: #bc52ff;"></ha-icon>
                              <span>XẢ PIN / CẤP TẢI (THEO GIỜ)</span>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(188, 82, 255, 0.2); border-radius: 12px; padding: 7px 10px; text-align: center;">
                              <div>
                                <div style="font-size: 8.5px; color: #d19eff; font-weight: 700; text-transform: uppercase;">CÔNG SUẤT XẢ</div>
                                <div style="font-size: 15px; font-weight: 900; color: #ff9f0a; margin-top: 2px;">${p_dis} <span style="font-size: 9.5px; color: #888;">W</span></div>
                              </div>
                              <div style="border-left: 1px solid rgba(255, 255, 255, 0.1);">
                                <div style="font-size: 8.5px; color: #d19eff; font-weight: 700; text-transform: uppercase;">PIN HIỆN TẠI</div>
                                <div style="font-size: 15px; font-weight: 900; color: #00ffcc; margin-top: 2px;">${soc}%</div>
                              </div>
                            </div>
                          </div>
                        `;
                      ]]]
                - type: entities
                  card_mod:
                    style: |
                      ha-card {
                        background: none !important;
                        border: none !important;
                        box-shadow: none !important;
                        padding: 0px !important;
                      }
                      .card-content {
                        padding: 0px !important;
                      }
                      hui-generic-entity-row {
                        padding: 3px 0px !important;
                      }
                  entities:
                    - entity: input_boolean.solar_discharge_enabled
                      name: Kích hoạt xả pin
                      icon: mdi:battery-arrow-down-outline
                    - entity: input_datetime.solar_discharge_start
                      name: Giờ bắt đầu xả
                      icon: mdi:clock-start
                    - entity: input_datetime.solar_discharge_end
                      name: Giờ kết thúc xả
                      icon: mdi:clock-end
                    - entity: input_number.solar_discharge_soc_cutoff
                      name: Ngưỡng dừng xả (SOC)
                      icon: mdi:battery-alert

        # ==========================================
        # 3. SƠ ĐỒ DÒNG NĂNG LƯỢNG (LUXPOWER SNA 6.5KW)
        # ==========================================
        - type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          show_label: false
          styles:
            card:
              - height: 378px
              - background-color: '#14171a'
              - border: 1px solid rgba(255, 255, 255, 0.1)
              - border-radius: 18px
              - padding: 14px 16px
              - color: '#ffffff'
              - box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4)
              - box-sizing: border-box
            grid:
              - grid-template-areas: '"content"'
              - grid-template-columns: 1fr
            custom_fields:
              content:
                - width: 100%
                - height: 100%
          custom_fields:
            content: |
              [[[
                var p_pv = parseFloat((states['sensor.luxpower_inverter_pv_pv_power'] && states['sensor.luxpower_inverter_pv_pv_power'].state != 'unavailable') ? states['sensor.luxpower_inverter_pv_pv_power'].state : '0');
                var p_grid = parseFloat((states['sensor.luxpower_inverter_grid_power_from_grid'] && states['sensor.luxpower_inverter_grid_power_from_grid'].state != 'unavailable') ? states['sensor.luxpower_inverter_grid_power_from_grid'].state : '0');
                var p_load = parseFloat((states['sensor.luxpower_inverter_load_power'] && states['sensor.luxpower_inverter_load_power'].state != 'unavailable') ? states['sensor.luxpower_inverter_load_power'].state : '0');
                var soc = (states['sensor.luxpower_inverter_battery_battery_soc'] && states['sensor.luxpower_inverter_battery_battery_soc'].state != 'unavailable') ? states['sensor.luxpower_inverter_battery_battery_soc'].state : '0';
                var b_power = (states['sensor.luxpower_inverter_battery_battery_power'] && states['sensor.luxpower_inverter_battery_battery_power'].state != 'unavailable') ? states['sensor.luxpower_inverter_battery_battery_power'].state : '0';
                var b_volt = (states['sensor.luxpower_inverter_battery_battery_voltage'] && states['sensor.luxpower_inverter_battery_battery_voltage'].state != 'unavailable') ? states['sensor.luxpower_inverter_battery_battery_voltage'].state : '0';

                var temp_state = states['sensor.luxpower_inverter_radiator_temperature'] || states['sensor.luxpower_radiator_temperature'];
                var inv_temp = (temp_state && temp_state.state != 'unavailable') ? temp_state.state : '0';

                var pv_st = states['sensor.luxpower_inverter_pv_pv_power'];
                var is_online = (pv_st && pv_st.state != 'unavailable' && pv_st.state != 'unknown');
                var wifi_icon = is_online ? "mdi:wifi" : "mdi:wifi-off";
                var wifi_text = is_online ? "Online" : "Offline";
                var wifi_color = is_online ? "#25d366" : "#ff3b30";

                var now = new Date().toLocaleTimeString('vi-VN', { hour12: false });

                var pv_path = "M 160 125 L 270 125 L 270 210 L 375 210";
                var grid_path = "M 840 125 L 730 125 L 730 210 L 625 210";
                var load_path = "M 625 290 L 730 290 L 730 375 L 840 375";

                var bat_num = parseFloat(b_power);
                var is_charging = bat_num < -5;
                var bat_path = is_charging 
                  ? "M 375 290 L 270 290 L 270 375 L 160 375" 
                  : "M 160 375 L 270 375 L 270 290 L 375 290";

                var soc_num = parseFloat(soc);
                var bat_icon = "mdi:battery-outline";
                if (is_charging) {
                  bat_icon = "mdi:battery-charging";
                } else if (soc_num >= 90) {
                  bat_icon = "mdi:battery";
                } else if (soc_num >= 70) {
                  bat_icon = "mdi:battery-70";
                } else if (soc_num >= 50) {
                  bat_icon = "mdi:battery-50";
                } else if (soc_num >= 30) {
                  bat_icon = "mdi:battery-30";
                } else if (soc_num >= 10) {
                  bat_icon = "mdi:battery-10";
                } else {
                  bat_icon = "mdi:battery-outline";
                }

                var pv_dots = (p_pv > 5) ? `
                  <circle r="8" fill="#25d366" filter="drop-shadow(0 0 8px #25d366)"><animateMotion path="${pv_path}" dur="2s" repeatCount="indefinite" /></circle>
                  <circle r="8" fill="#25d366" filter="drop-shadow(0 0 8px #25d366)"><animateMotion path="${pv_path}" dur="2s" begin="0.66s" repeatCount="indefinite" /></circle>
                  <circle r="8" fill="#25d366" filter="drop-shadow(0 0 8px #25d366)"><animateMotion path="${pv_path}" dur="2s" begin="1.33s" repeatCount="indefinite" /></circle>
                ` : '';

                var grid_dots = (p_grid > 5) ? `
                  <circle r="8" fill="#4a90e2" filter="drop-shadow(0 0 8px #4a90e2)"><animateMotion path="${grid_path}" dur="2s" repeatCount="indefinite" /></circle>
                  <circle r="8" fill="#4a90e2" filter="drop-shadow(0 0 8px #4a90e2)"><animateMotion path="${grid_path}" dur="2s" begin="0.66s" repeatCount="indefinite" /></circle>
                  <circle r="8" fill="#4a90e2" filter="drop-shadow(0 0 8px #4a90e2)"><animateMotion path="${grid_path}" dur="2s" begin="1.33s" repeatCount="indefinite" /></circle>
                ` : '';

                var load_dots = (p_load > 5) ? `
                  <circle r="8" fill="#ff5722" filter="drop-shadow(0 0 8px #ff5722)"><animateMotion path="${load_path}" dur="2s" repeatCount="indefinite" /></circle>
                  <circle r="8" fill="#ff5722" filter="drop-shadow(0 0 8px #ff5722)"><animateMotion path="${load_path}" dur="2s" begin="0.66s" repeatCount="indefinite" /></circle>
                  <circle r="8" fill="#ff5722" filter="drop-shadow(0 0 8px #ff5722)"><animateMotion path="${load_path}" dur="2s" begin="1.33s" repeatCount="indefinite" /></circle>
                ` : '';

                var bat_dots = (Math.abs(bat_num) > 5) ? `
                  <circle r="8" fill="#bc52ff" filter="drop-shadow(0 0 8px #bc52ff)"><animateMotion path="${bat_path}" dur="2s" repeatCount="indefinite" /></circle>
                  <circle r="8" fill="#bc52ff" filter="drop-shadow(0 0 8px #bc52ff)"><animateMotion path="${bat_path}" dur="2s" begin="0.66s" repeatCount="indefinite" /></circle>
                  <circle r="8" fill="#bc52ff" filter="drop-shadow(0 0 8px #bc52ff)"><animateMotion path="${bat_path}" dur="2s" begin="1.33s" repeatCount="indefinite" /></circle>
                ` : '';

                return `
                  <style>
                    @keyframes flow-dash { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
                    .active-flow { animation: flow-dash 1s linear infinite; }
                  </style>

                  <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%; width: 100%; box-sizing: border-box;">
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                      <div style="font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 0.5px;">DÒNG NĂNG LƯỢNG</div>
                      <div style="background: rgba(37,211,102,0.12); border: 1px solid rgba(37,211,102,0.3); padding: 4px 12px; border-radius: 16px; font-size: 11px; color: #25d366; font-weight: 700; display: flex; align-items: center; gap: 6px;">
                        <span style="height: 6px; width: 6px; background-color: #25d366; border-radius: 50%; box-shadow: 0 0 6px #25d366;"></span> 
                        Cập nhật: <span id="live-clock-mob">${now}</span>
                      </div>
                    </div>

                    <div style="position: relative; height: 300px; width: 100%; display: flex; justify-content: space-between; align-items: center;">
                      <svg viewBox="0 0 1000 500" preserveAspectRatio="none" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 1;">
                        <defs>
                          <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#25d366"/>
                          </marker>
                          <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bc52ff"/>
                          </marker>
                          <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4a90e2"/>
                          </marker>
                          <marker id="arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff5722"/>
                          </marker>
                        </defs>

                        <path d="${pv_path}" stroke="#25d366" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" fill="none" stroke-dasharray="6,6" marker-end="url(#arr-green)" class="${p_pv > 5 ? 'active-flow' : ''}" />
                        <path d="${bat_path}" stroke="#bc52ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" fill="none" stroke-dasharray="6,6" marker-end="url(#arr-purple)" class="${Math.abs(bat_num) > 5 ? 'active-flow' : ''}" />
                        <path d="${grid_path}" stroke="#4a90e2" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" fill="none" stroke-dasharray="6,6" marker-end="url(#arr-blue)" class="${p_grid > 5 ? 'active-flow' : ''}" />
                        <path d="${load_path}" stroke="#ff5722" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" fill="none" stroke-dasharray="6,6" marker-end="url(#arr-orange)" class="${p_load > 5 ? 'active-flow' : ''}" />

                        ${pv_dots}
                        ${bat_dots}
                        ${grid_dots}
                        ${load_dots}
                      </svg>

                      <!-- CỘT 1 (TRÁI): PV & PIN -->
                      <div style="width: 35%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; z-index: 2;">
                        <div style="display: flex; align-items: center; gap: 8px; margin-top: 15px;">
                          <ha-icon icon="mdi:solar-power" style="--mdc-icon-size: 32px; color: #25d366;"></ha-icon>
                          <div>
                            <div style="font-size: 12px; color: #888; font-weight: 600;">PV</div>
                            <div style="font-size: 15px; font-weight: 800; color: #25d366; line-height: 1.2;">${p_pv} <span style="font-size: 11px; color: #888; font-weight: 400;">W</span></div>
                          </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
                          <ha-icon icon="${bat_icon}" style="--mdc-icon-size: 32px; color: #bc52ff;"></ha-icon>
                          <div>
                            <div style="font-size: 13px; color: #bc52ff; font-weight: 800;">${soc}%</div>
                            <div style="font-size: 14px; font-weight: 800; color: #fff; line-height: 1.2;">${b_power} <span style="font-size: 10px; color: #aaa; font-weight: 400;">W</span></div>
                            <div style="font-size: 11px; color: #aaa;">${b_volt} V</div>
                          </div>
                        </div>
                      </div>

                      <!-- CỘT 2 (GIỮA): LUXPOWER SNA PRO 6.5KW -->
                      <div style="width: 30%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2; position: relative;">
                        <div style="position: relative; max-width: 95px; width: 85%; height: 130px; background: linear-gradient(160deg, #ffffff 0%, #f0f2f5 70%, #dce0e6 100%); border-radius: 12px; border: 1px solid #dcdfe6; box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 2px 2px #ffffff, inset 0 -3px 5px rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px 5px 5px 5px; box-sizing: border-box; margin-top: 18px;">
                          <div style="position: absolute; top: -26px; display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 800; color: ${wifi_color}; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 10px; border: 1px solid ${wifi_color}; box-shadow: 0 0 6px ${wifi_color}50; white-space: nowrap;">
                            <ha-icon icon="${wifi_icon}" style="--mdc-icon-size: 12px; color: ${wifi_color};"></ha-icon>
                            <span>${wifi_text}</span>
                          </div>

                          <div style="width: 100%; display: flex; align-items: center; justify-content: flex-start; gap: 2px; padding-left: 3px;">
                            <span style="font-size: 8px; font-weight: 900; color: #1a252c; letter-spacing: -0.2px;">LUX<span style="color: #25d366;">⚡</span>POWER<span style="font-size: 6px; color: #666;">TEK</span></span>
                          </div>

                          <div style="width: 68px; height: 48px; background: #080d14; border-radius: 6px; border: 1.5px solid #222; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);">
                            <div style="display: flex; align-items: center; gap: 3px;">
                              <span style="height: 4px; width: 4px; background-color: #25d366; border-radius: 50%; box-shadow: 0 0 4px #25d366;"></span>
                              <span style="font-size: 8px; color: #4a90e2; font-weight: 800;">SNA 6.5KW</span>
                            </div>

                            <div style="font-size: 12px; font-weight: 800; color: #00ffcc; display: flex; align-items: center; gap: 2px; text-shadow: 0 0 5px rgba(0,255,204,0.6);">
                              <ha-icon icon="mdi:thermometer" style="--mdc-icon-size: 13px; color: #00ffcc;"></ha-icon>
                              <span>${inv_temp}°C</span>
                            </div>

                            <div style="display: flex; gap: 5px;">
                              <span style="height: 2.5px; width: 8px; background: #25d366; border-radius: 1px;"></span>
                              <span style="height: 2.5px; width: 8px; background: #4a90e2; border-radius: 1px;"></span>
