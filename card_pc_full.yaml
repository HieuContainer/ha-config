                      <circle cx="30" cy="30" r="26" stroke="rgba(255,255,255,0.06)" stroke-width="4" fill="none" />
                      <circle cx="30" cy="30" r="26" stroke="${ringColor}" stroke-width="4" stroke-linecap="round" fill="none"
                        stroke-dasharray="163.3" stroke-dashoffset="${163.3 - strokeDash}" style="transition: stroke-dashoffset 1s linear;" />
                    </svg>
                    <div style="position:absolute; text-align:center;">
                      <div style="font-size:${is_on ? '18px' : '15px'}; font-weight:900; color:${is_on ? '#ff9f0a' : '#8e8e93'}; line-height:1.1;">
                        ${is_on ? time_str : 'OFF'}
                      </div>
                      <div style="font-size:9px; color:#888; font-weight:700; margin-top:2px;">
                        ${is_on ? 'ĐANG BẬT' : 'ĐÃ TẮT'}
                      </div>
                    </div>
                  </div>
                `;
              ]]]
            footer: |
              [[[
                var is_on = entity.state === 'on';
                var bg = is_on ? '#ff453a' : 'rgba(255,255,255,0.08)';
                var text = is_on ? 'CHẠM ĐỂ TẮT' : 'BẬT 20 PHÚT';
                var col = '#ffffff';
                var shadow = is_on ? 'box-shadow: 0 4px 14px rgba(255,69,58,0.4);' : '';

                return `
