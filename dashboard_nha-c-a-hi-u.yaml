              \ border-box;\">\n        <div style=\"flex: 1; background: #2f1b42;\
              \ height: 8px; border-radius: 4px; overflow: hidden;\">\n          <div\
              \ style=\"width: ${soc}%; background: linear-gradient(90deg, #6c2bd9,\
              \ #bc52ff); height: 100%; border-radius: 4px;\"></div>\n        </div>\n\
              \        <div style=\"font-size: 17px; font-weight: 800; color: #d19eff;\"\
              >${soc}%</div>\n      </div>\n    </div>\n  `;\n]]]\n"
