              \ text-align: center;\">\n            <div style=\"font-size: 8px; color:\
              \ #d19eff; font-weight: 800; letter-spacing: 0.3px;\">SẠC HÔM NAY</div>\n\
              \            <div style=\"font-size: 16px; font-weight: 800; color:\
              \ #fff; margin-top: 1px;\">${b_chg_today} <span style=\"font-size: 9px;\
              \ color: #aaa; font-weight: 400;\">kWh</span></div>\n            <div\
