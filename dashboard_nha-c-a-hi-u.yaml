              \ style=\"--mdc-icon-size: 15px; color: #25d366;\"></ha-icon> ÔNG MẶT\
              \ TRỜI\n          </div>\n          <ha-icon icon=\"mdi:solar-power\"\
              \ style=\"--mdc-icon-size: 24px; color: #25d366; opacity: 0.6;\"></ha-icon>\n\
