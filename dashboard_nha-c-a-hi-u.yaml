              display: flex; flex-direction: column; justify-content: space-between;\
              \ height: 100%; width: 100%; box-sizing: border-box;\">\n      <div>\n\
              \        <!-- THANH TIÊU ĐỀ: ÔNG MẶT TRỜI -->\n        <div style=\"\
