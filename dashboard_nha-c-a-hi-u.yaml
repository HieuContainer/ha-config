              >\n            <div style=\"font-size: 9px; color: #81b89a; font-weight:\
              \ 800; display: flex; align-items: center; justify-content: center;\
              \ gap: 4px;\">\n              <span style=\"height: 5px; width: 5px;\
              \ background-color: #25d366; border-radius: 50%; display: inline-block;\
              \ box-shadow: 0 0 5px #25d366;\"></span> HÔM NAY\n            </div>\n\
              \            <div style=\"font-size: 22px; font-weight: 800; color:\
              \ #fff; margin-top: 2px; line-height: 1.1;\">${p_today}</div>\n    \
              \        <div style=\"font-size: 10px; color: #aaa; margin-top: 1px;\"\
              >kWh</div>\n          </div>\n          \n          <div style=\"width:\
              \ 1px; height: 36px; background: rgba(255,255,255,0.12);\"></div>\n\
              \          \n          <div style=\"text-align: center;\">\n       \
              \     <div style=\"font-size: 9px; color: #81b89a; font-weight: 800;\
              \ display: flex; align-items: center; justify-content: center; gap:\
              \ 4px;\">\n              <span style=\"height: 5px; width: 5px; background-color:\
              \ #25d366; border-radius: 50%; display: inline-block;\"></span> THÁNG\
              \ NÀY\n            </div>\n            <div style=\"font-size: 22px;\
              \ font-weight: 800; color: #fff; margin-top: 2px; line-height: 1.1;\"\
              >${p_total}</div>\n            <div style=\"font-size: 10px; color:\
              \ #aaa; margin-top: 1px;\">kWh</div>\n          </div>\n        </div>\n\
              \      </div>\n\n      <!-- TRẠNG THÁI CĂN GIỮA -->\n      <div style=\"\
              background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 5px 10px;\
              \ display: flex; flex-direction: column; justify-content: center; align-items:\
              \ center; gap: 2px; width: 100%; box-sizing: border-box;\">\n      \
              \  <div style=\"display: flex; justify-content: center; align-items:\
              \ center; gap: 8px;\">\n          <div style=\"display: flex; align-items:\
              \ center; gap: 6px; font-size: 11px; font-weight: 700; color: #fff;\"\
