            content: "[[[\n  var soc = (states['sensor.luxpower_inverter_battery_battery_soc']\
              \ && states['sensor.luxpower_inverter_battery_battery_soc'].state !=\
              \ 'unavailable') ? states['sensor.luxpower_inverter_battery_battery_soc'].state\
