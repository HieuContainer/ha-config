              \ && states['sensor.luxpower_inverter_battery_discharge_energy_total'].state\
              \ != 'unavailable') ? states['sensor.luxpower_inverter_battery_discharge_energy_total'].state\
              \ : '0.0');\n\n  // LOGIC ICON PIN ĐỘNG THEO DUNG LƯỢNG SOC (%)\n  var\
              \ soc_num = parseFloat(soc);\n  var bat_num = parseFloat(b_power);\n\
              \  var bat_icon = \"mdi:battery-outline\";\n\n  if (bat_num < -5) {\n\
              \    bat_icon = \"mdi:battery-charging\";\n  } else if (soc_num >= 90)\
