              \ column; justify-content: space-between; height: 100%; width: 100%;\
              \ box-sizing: border-box;\">\n      <div>\n        <!-- THANH TIÊU ĐỀ:\
              \ PIN LƯU TRỮ -->\n        <div style=\"display: flex; justify-content:\
              \ space-between; align-items: center; margin-bottom: 8px; width: 100%;\"\
              >\n          <div style=\"display: flex; align-items: center; gap: 6px;\
              \ background: rgba(209,158,255,0.15); padding: 4px 8px; border-radius:\
              \ 10px; color: #d19eff; font-weight: 800; font-size: 11px;\">\n    \
              \        <ha-icon icon=\"${bat_icon}\" style=\"--mdc-icon-size: 15px;\
              \ color: #d19eff;\"></ha-icon> PIN LƯU TRỮ\n          </div>\n     \
              \     <ha-icon icon=\"${bat_icon}\" style=\"--mdc-icon-size: 24px; color:\
