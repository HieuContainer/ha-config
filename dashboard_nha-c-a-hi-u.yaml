              font-size: 10px; font-weight: 400; color: #aaa;\">W</span></div>\n \
              \       </div>\n\n        <div style=\"font-size: 10px; color: #81b89a;\
              \ font-weight: 600; display: flex; align-items: center; gap: 4px;\"\
              >\n          <ha-icon icon=\"mdi:flash\" style=\"--mdc-icon-size: 12px;\
