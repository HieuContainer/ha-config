- id: '1783839133972'
  alias: Bình nóng lạnh - Tự tắt sau 20 phút
  description: Bật bình nóng lạnh thì chạy timer và tự tắt sau 20 phút
  triggers:
  - trigger: state
    entity_id:
    - switch.cong_tac_nong_lanh
    to:
    - 'on'
  conditions: []
  actions:
  - action: timer.start
    target:
      entity_id: timer.nong_lanh_20_phut
    data:
      duration: 00:20:00
  - wait_for_trigger:
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.nong_lanh_20_phut
    continue_on_timeout: false
  - condition: state
    entity_id: switch.cong_tac_nong_lanh
    state: 'on'
  - action: switch.turn_off
    target:
      entity_id: switch.cong_tac_nong_lanh
  mode: restart
- id: '1783922667532'
  alias: Bình nóng lạnh - Tắt thì hủy timer
  description: Tắt bình thủ công thì hủy bộ đếm
  triggers:
  - trigger: state
    entity_id:
    - switch.cong_tac_nong_lanh
    to:
    - 'off'
  conditions: []
  actions:
  - action: timer.cancel
    target:
      entity_id: timer.nong_lanh_20_phut
  mode: restart

# ==========================================
# 1. KÍCH HOẠT QUÉT BIỂN SỐ XE KHI CAMERA HOẠT ĐỘNG
# ==========================================
- id: 'trigger_scan_plate_on_motion'
  alias: "Camera Sân - Quét Biển Số Xe"
  description: "Khi camera sân phát hiện chuyển động hoặc nhận diện xe thì gọi AI quét biển số"
  triggers:
    # 1. Bắt sự kiện chuyển động / phát hiện xe / người từ camera Imou qua HA Event Bus
    - trigger: event
      event_type: imou_ranger_vehicle_detected
    - trigger: event
      event_type: imou_ranger_motion
    - trigger: event
      event_type: imou_ranger_human_detected

    # 2. Bắt trạng thái cảm biến chuyển động / nhận diện xe Imou
    - trigger: state
      entity_id:
        - binary_sensor.ipc_gs7e_3m0we_chuyen_dong
        - binary_sensor.ipc_gs7e_3m0we_phat_hien_xe
        - binary_sensor.ipc_gs7e_3m0we_2_chuyen_dong
        - binary_sensor.ipc_gs7e_3m0we_2_phat_hien_xe
        - binary_sensor.imou_ranger_2_chuyen_dong
        - binary_sensor.imou_ranger_2_phat_hien_xe
      to: 'on'
  conditions: []
  actions:
    # Quét ảnh 5 lần, mỗi lần cách nhau 2 giây (tổng cộng 10 giây) để bắt kịp lúc xe rẽ vào và dừng trước cổng
    - repeat:
        count: 5
        sequence:
          - action: image_processing.scan
            target:
              entity_id:
                - image_processing.platerecognizer_ipc_gs7e_3m0we_2
                - image_processing.platerecognizer_ipc_gs7e_3m0we
          - delay:
              seconds: 2
  mode: restart

# ==========================================
# 2. TỰ ĐỘNG MỞ CỬA CUỐN KHI QUÉT ĐÚNG XE 30K-588.75
# ==========================================
- id: 'auto_open_door_by_plate_30k58875'
  alias: "Cửa Cuốn - Tự Động Mở Khi Nhận Diện Xe 30K-588.75"
  description: "Camera quét đúng biển số xe 30K-588.75 thì tự động mở cửa cuốn (bất kể trạng thái cửa hiện tại)"
  triggers:
    - trigger: state
      entity_id:
        - image_processing.platerecognizer_ipc_gs7e_3m0we_2
        - image_processing.platerecognizer_ipc_gs7e_3m0we
    - trigger: event
      event_type: platerecognizer.vehicle_detected
  conditions:
    # So khớp biển số xe 30K-588.75 (làm sạch dấu chấm, gạch ngang, khoảng trắng, chữ hoa/thường)
    - condition: template
      value_template: >
        {% set target = '30k58875' %}
        {% set ev_p = (trigger.event.data.plate if (trigger.event is defined and trigger.event.data is defined and trigger.event.data.plate is defined) else '') | lower | replace('-', '') | replace('.', '') | replace(' ', '') %}
        {% set v1 = state_attr('image_processing.platerecognizer_ipc_gs7e_3m0we_2', 'vehicles') or [] %}
        {% set plates1 = v1 | map(attribute='plate') | list if v1 is iterable else [] %}
        {% set v2 = state_attr('image_processing.platerecognizer_ipc_gs7e_3m0we', 'vehicles') or [] %}
        {% set plates2 = v2 | map(attribute='plate') | list if v2 is iterable else [] %}
        {% set wp1 = state_attr('image_processing.platerecognizer_ipc_gs7e_3m0we_2', 'watched_plates') or {} %}
        {% set wp2 = state_attr('image_processing.platerecognizer_ipc_gs7e_3m0we', 'watched_plates') or {} %}
        {% set all_raw = [] %}
        {% if ev_p %}{% set _ = all_raw.append(ev_p) %}{% endif %}
        {% for p in plates1 %}{% set _ = all_raw.append(p) %}{% endfor %}
        {% for p in plates2 %}{% set _ = all_raw.append(p) %}{% endfor %}
        {% if wp1 is mapping %}
          {% for k, v in wp1.items() %}
            {% if v == true %}{% set _ = all_raw.append(k) %}{% endif %}
          {% endfor %}
        {% endif %}
        {% if wp2 is mapping %}
          {% for k, v in wp2.items() %}
            {% if v == true %}{% set _ = all_raw.append(k) %}{% endif %}
          {% endfor %}
        {% endif %}
        {% set normalized = all_raw | map('lower') | map('replace', '-', '') | map('replace', '.', '') | map('replace', ' ', '') | list %}
        {% set match = namespace(found=false) %}
        {% for p in normalized %}
          {% if target in p or p in target or '30k5887' in p %}
            {% set match.found = true %}
          {% endif %}
        {% endfor %}
        {{ match.found }}
  actions:
    # A. Chụp ảnh lưu lại snapshot lịch sử xe về
    - action: camera.snapshot
      target:
        entity_id: camera.ipc_gs7e_3m0we_2
      data:
        filename: /config/www/snapshots/xe_30k58875_latest.jpg

    - action: camera.snapshot
      target:
        entity_id: camera.ipc_gs7e_3m0we_2
      data:
        filename: "/config/www/snapshots/xe_30k58875_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg"

    # B. Ghi sự kiện vào Lịch sử (Logbook) của Home Assistant
    - action: logbook.log
      data:
        name: "🚗 Nhận diện xe 30K-588.75"
        message: "Camera sân đã nhận diện đúng xe 30K-588.75 lúc {{ now().strftime('%H:%M:%S ngày %d/%m/%Y') }}. Đã tự động mở cửa cuốn."
        entity_id: cover.cong_tac_cua_cuon

    # C. Gọi kịch bản mở cửa cuốn
    - action: script.turn_on
      target:
        entity_id: script.cua_mo

    # D. Gửi thông báo đẩy về điện thoại kèm ảnh chụp xe
    - action: notify.notify
      data:
        title: "🚗 Đã nhận diện xe 30K-588.75!"
        message: "Camera Sân đã quét đúng xe 30K-588.75 của bạn lúc {{ now().strftime('%H:%M:%S ngày %d/%m/%Y') }}. Cửa cuốn đang tự động mở!"
        data:
          image: "/local/snapshots/xe_30k58875_latest.jpg"
          push:
            sound: "default"
            interruption-level: "time-sensitive"
          ttl: 0
          priority: high
          channel: "alpr_door_alert"

    # E. Lưu thông báo kèm hình ảnh trên Bảng thông báo của Home Assistant
    - action: notify.persistent_notification
      data:
        title: "🚗 Lịch sử xe về: 30K-588.75"
        message: >
          ![Ảnh chụp xe](/local/snapshots/xe_30k58875_latest.jpg?t={{ now().timestamp() }})

          **Thời gian:** {{ now().strftime('%H:%M:%S ngày %d/%m/%Y') }}

          **Biển số:** 30K-588.75

          **Camera:** Sân trước

          **Hành động:** Nhận diện thành công & Đã tự động mở cửa cuốn.
  mode: single

# ==========================================
# 3. ĐỒNG BỘ TRẠNG THÁI CỬA CUỐN KHI ĐÓNG/MỞ
# ==========================================
- id: 'sync_door_state_closed'
  alias: "Cửa Cuốn - Tự Đồng Bộ Trạng Thái Khi Đóng"
  description: "Khi công tắc cửa cuốn chuyển sang closed thì cập nhật input_select về ĐÃ ĐÓNG"
  triggers:
    - trigger: state
      entity_id: cover.cong_tac_cua_cuon
      to: 'closed'
  conditions: []
  actions:
    - action: input_select.select_option
      target:
        entity_id: input_select.trang_thai_cua
      data:
        option: "ĐÃ ĐÓNG"
  mode: single

- id: 'sync_door_state_open'
  alias: "Cửa Cuốn - Tự Đồng Bộ Trạng Thái Khi Mở"
  description: "Khi công tắc cửa cuốn chuyển sang open thì cập nhật input_select về ĐÃ MỞ"
  triggers:
    - trigger: state
      entity_id: cover.cong_tac_cua_cuon
      to: 'open'
  conditions: []
  actions:
    - action: input_select.select_option
      target:
        entity_id: input_select.trang_thai_cua
      data:
        option: "ĐÃ MỞ"
  mode: single





