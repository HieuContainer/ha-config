- id: '1783839133972'
  alias: Bình nóng lạnh - Tự tắt sau 20 phút
  description: Bật bình nóng lạnh thì chạy timer và tự tắt sau 20 phút
  triggers:
  - trigger: state
    entity_id:
    - switch.cong_tac_nong_lanh
    to:
    - 'on'
  conditions: []
  actions:
  - action: timer.start
    target:
      entity_id: timer.nong_lanh_20_phut
    data:
      duration: 00:20:00
  - wait_for_trigger:
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.nong_lanh_20_phut
    continue_on_timeout: false
  - condition: state
    entity_id: switch.cong_tac_nong_lanh
    state: 'on'
  - action: switch.turn_off
    target:
      entity_id: switch.cong_tac_nong_lanh
  mode: restart
- id: '1783922667532'
  alias: Bình nóng lạnh - Tắt thì hủy timer
  description: Tắt bình thủ công thì hủy bộ đếm
  triggers:
  - trigger: state
    entity_id:
    - switch.cong_tac_nong_lanh
    to:
    - 'off'
  conditions: []
  actions:
  - action: timer.cancel
    target:
      entity_id: timer.nong_lanh_20_phut
  mode: restart

# ==========================================
# 1. KÍCH HOẠT QUÉT BIỂN SỐ XE KHI CAMERA HOẠT ĐỘNG
# ==========================================
- id: 'trigger_scan_plate_on_motion'
  alias: "Camera Sân - Quét Biển Số Xe"
  description: "Khi camera sân phát hiện chuyển động hoặc nhận diện xe thì gọi AI quét biển số"
  triggers:
    # 1. Bắt sự kiện chuyển động / phát hiện xe từ camera Imou qua HA Event Bus
    - trigger: event
      event_type: imou_ranger_vehicle_detected
    - trigger: event
      event_type: imou_ranger_motion

    # 2. Bắt trạng thái cảm biến chuyển động / nhận diện xe Imou
    - trigger: state
      entity_id:
        - binary_sensor.ipc_gs7e_3m0we_chuyen_dong
        - binary_sensor.ipc_gs7e_3m0we_phat_hien_xe
        - binary_sensor.ipc_gs7e_3m0we_2_chuyen_dong
        - binary_sensor.ipc_gs7e_3m0we_2_phat_hien_xe
        - binary_sensor.imou_ranger_2_chuyen_dong
        - binary_sensor.imou_ranger_2_phat_hien_xe
      to: 'on'
  conditions:
    # Chỉ quét khi cửa cuốn chưa ở trạng thái đang mở hoặc đã mở
    - condition: template
      value_template: >
        {{ states('input_select.trang_thai_cua') != 'ĐANG MỞ' and states('input_select.trang_thai_cua') != 'ĐÃ MỞ' }}
  actions:
    # Quét ảnh 3 lần cách nhau 2 giây để bắt trọn góc chụp xe rõ nhất khi xe tiến vào sân
    - repeat:
        count: 3
        sequence:
          - action: image_processing.scan
            target:
              entity_id:
                - image_processing.platerecognizer_ipc_gs7e_3m0we_2
                - image_processing.platerecognizer_ipc_gs7e_3m0we
          - delay:
              seconds: 2
  mode: restart

# ==========================================
# 2. TỰ ĐỘNG MỞ CỬA CUỐN KHI QUÉT ĐÚNG XE 30K-588.75
# ==========================================
- id: 'auto_open_door_by_plate_30k58875'
  alias: "Cửa Cuốn - Tự Động Mở Khi Nhận Diện Xe 30K-588.75"
  description: "Camera quét đúng biển số xe 30K-588.75 và nhận diện xe thì tự động mở cửa cuốn"
  triggers:
    - trigger: state
      entity_id:
        - image_processing.platerecognizer_ipc_gs7e_3m0we_2
        - image_processing.platerecognizer_ipc_gs7e_3m0we
    - trigger: event
      event_type: platerecognizer.vehicle_detected
    - trigger: event
      event_type: platerecognizer.plate_detected
  conditions:
    # 1. Phải có ít nhất 1 biển số được tìm thấy hoặc có sự kiện xe đến
    - condition: template
      value_template: >
        {% set s1 = states('image_processing.platerecognizer_ipc_gs7e_3m0we_2') | int(0) %}
        {% set s2 = states('image_processing.platerecognizer_ipc_gs7e_3m0we') | int(0) %}
        {% set has_event = trigger.event is defined and trigger.event.data is defined %}
        {{ s1 > 0 or s2 > 0 or has_event }}

    # 2. Phải đúng biển số xe 30K-588.75 (so khớp không phân biệt hoa thường, dấu gạch, chấm)
    - condition: template
      value_template: >
        {% set p1 = state_attr('image_processing.platerecognizer_ipc_gs7e_3m0we_2', 'watched_plates') or {} %}
        {% set p2 = state_attr('image_processing.platerecognizer_ipc_gs7e_3m0we', 'watched_plates') or {} %}
        {% set ev_p = (trigger.event.data.plate if trigger.event is defined and trigger.event.data is defined else '') | lower | replace('-', '') | replace('.', '') | replace(' ', '') %}
        {% set res1 = (state_attr('image_processing.platerecognizer_ipc_gs7e_3m0we_2', 'results') or []) | map(attribute='plate') | list | map('lower') | list %}
        {% set res2 = (state_attr('image_processing.platerecognizer_ipc_gs7e_3m0we', 'results') or []) | map(attribute='plate') | list | map('lower') | list %}
        {{ (p1 is mapping and (p1.get('30k58875') == true or p1.get('30K58875') == true or p1.get('30K-588.75') == true or p1.get('30K-58875') == true or p1.get('30k-588.75') == true or p1.get('30k-58875') == true))
           or (p2 is mapping and (p2.get('30k58875') == true or p2.get('30K58875') == true or p2.get('30K-588.75') == true or p2.get('30K-58875') == true or p2.get('30k-588.75') == true or p2.get('30k-58875') == true))
           or '30k58875' in res1 or '30k58875' in res2
           or '30k58875' in ev_p }}

    # 3. Cửa cuốn hiện tại phải không ở trạng thái đang mở hoặc đã mở
    - condition: template
      value_template: >
        {{ states('input_select.trang_thai_cua') != 'ĐANG MỞ' and states('input_select.trang_thai_cua') != 'ĐÃ MỞ' }}
  actions:
    # A. Chụp ảnh lưu lại snapshot lịch sử xe về
    - action: camera.snapshot
      target:
        entity_id: camera.ipc_gs7e_3m0we_2
      data:
        filename: /config/www/snapshots/xe_30k58875_latest.jpg

    - action: camera.snapshot
      target:
        entity_id: camera.ipc_gs7e_3m0we_2
      data:
        filename: "/config/www/snapshots/xe_30k58875_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg"

    # B. Ghi sự kiện vào Lịch sử (Logbook) của Home Assistant
    - action: logbook.log
      data:
        name: "🚗 Nhận diện xe 30K-588.75"
        message: "Camera sân đã chụp ảnh và nhận diện đúng xe 30K-588.75 lúc {{ now().strftime('%H:%M:%S ngày %d/%m/%Y') }}. Đã tự động mở cửa cuốn."
        entity_id: cover.cong_tac_cua_cuon

    # C. Gọi kịch bản mở cửa cuốn
    - action: script.turn_on
      target:
        entity_id: script.cua_mo

    # D. Gửi thông báo đẩy về điện thoại kèm ảnh chụp xe
    - action: notify.notify
      data:
        title: "🚗 Đã nhận diện xe 30K-588.75!"
        message: "Camera Sân đã quét đúng xe 30K-588.75 của bạn lúc {{ now().strftime('%H:%M:%S ngày %d/%m/%Y') }}. Cửa cuốn đang tự động mở!"
        data:
          image: "/local/snapshots/xe_30k58875_latest.jpg"
          push:
            sound: "default"
            interruption-level: "time-sensitive"
          ttl: 0
          priority: high
          channel: "alpr_door_alert"

    # E. Lưu thông báo kèm hình ảnh trên Bảng thông báo của Home Assistant
    - action: notify.persistent_notification
      data:
        title: "🚗 Lịch sử xe về: 30K-588.75"
        message: >
          ![Ảnh chụp xe](/local/snapshots/xe_30k58875_latest.jpg?t={{ now().timestamp() }})

          **Thời gian:** {{ now().strftime('%H:%M:%S ngày %d/%m/%Y') }}

          **Biển số:** 30K-588.75

          **Camera:** Sân trước

          **Hành động:** Nhận diện thành công & Đã tự động mở cửa cuốn.
  mode: single




