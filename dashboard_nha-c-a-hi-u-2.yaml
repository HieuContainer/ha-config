views:
- type: sections
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Mục mới
    - type: custom:button-card
      show_icon: false
      show_name: false
      show_state: false
      show_label: false
      styles:
        card:
        - height: 348px
        - background-color: '#14171a'
        - border: 1px solid
        - border-radius: 18px
        - padding: 14px
        - color: '#ffffff'
        grid:
        - grid-template-areas: '"content"'
        - grid-template-columns: 1fr
        custom_fields:
          content:
          - width: 100%
          - height: 100%
      custom_fields:
        content: "[[[\n  var p_pv = parseFloat((states['sensor.luxpower_inverter_pv_pv_power']\
          \ && states['sensor.luxpower_inverter_pv_pv_power'].state != 'unavailable')\
          \ ? states['sensor.luxpower_inverter_pv_pv_power'].state : '0');\n  var\
          \ p_grid = parseFloat((states['sensor.luxpower_inverter_grid_power_from_grid']\
          \ && states['sensor.luxpower_inverter_grid_power_from_grid'].state != 'unavailable')\
          \ ? states['sensor.luxpower_inverter_grid_power_from_grid'].state : '0');\n\
          \  var p_load = parseFloat((states['sensor.luxpower_inverter_load_power']\
          \ && states['sensor.luxpower_inverter_load_power'].state != 'unavailable')\
          \ ? states['sensor.luxpower_inverter_load_power'].state : '0');\n  var soc\
          \ = (states['sensor.luxpower_inverter_battery_battery_soc'] && states['sensor.luxpower_inverter_battery_battery_soc'].state\
          \ != 'unavailable') ? states['sensor.luxpower_inverter_battery_battery_soc'].state\
          \ : '0';\n  var b_power = (states['sensor.luxpower_inverter_battery_battery_power']\
          \ && states['sensor.luxpower_inverter_battery_battery_power'].state != 'unavailable')\
          \ ? states['sensor.luxpower_inverter_battery_battery_power'].state : '0';\n\
          \  var b_volt = (states['sensor.luxpower_inverter_battery_battery_voltage']\
          \ && states['sensor.luxpower_inverter_battery_battery_voltage'].state !=\
          \ 'unavailable') ? states['sensor.luxpower_inverter_battery_battery_voltage'].state\
          \ : '0';\n  \n  var temp_state = states['sensor.luxpower_inverter_radiator_temperature']\
          \ || states['sensor.luxpower_radiator_temperature'];\n  var inv_temp = (temp_state\
          \ && temp_state.state != 'unavailable') ? temp_state.state : '0';\n\n  var\
          \ pv_st = states['sensor.luxpower_inverter_pv_pv_power'];\n  var is_online\
          \ = (pv_st && pv_st.state != 'unavailable' && pv_st.state != 'unknown');\n\
          \  var wifi_icon = is_online ? \"mdi:wifi\" : \"mdi:wifi-off\";\n  var wifi_text\
          \ = is_online ? \"Online\" : \"Offline\";\n  var wifi_color = is_online\
          \ ? \"#25d366\" : \"#ff3b30\";\n\n  var now = new Date().toLocaleTimeString('vi-VN',\
          \ { hour12: false });\n\n  var pv_path = \"M 160 140 L 270 140 L 270 240\
          \ L 375 240\";\n  var grid_path = \"M 840 140 L 730 140 L 730 240 L 625\
          \ 240\";\n  var load_path = \"M 625 310 L 730 310 L 730 400 L 840 400\"\
          ;\n\n  var bat_num = parseFloat(b_power);\n  var is_charging = bat_num <\
          \ -5;\n  var bat_path = is_charging \n    ? \"M 375 310 L 270 310 L 270\
          \ 400 L 160 400\" \n    : \"M 160 400 L 270 400 L 270 310 L 375 310\";\n\
          \n  var soc_num = parseFloat(soc);\n  var bat_icon = \"mdi:battery-outline\"\
          ;\n\n  if (is_charging) {\n    bat_icon = \"mdi:battery-charging\";\n  }\
          \ else if (soc_num >= 90) {\n    bat_icon = \"mdi:battery\";\n  } else if\
          \ (soc_num >= 70) {\n    bat_icon = \"mdi:battery-70\";\n  } else if (soc_num\
          \ >= 50) {\n    bat_icon = \"mdi:battery-50\";\n  } else if (soc_num >=\
          \ 30) {\n    bat_icon = \"mdi:battery-30\";\n  } else if (soc_num >= 10)\
          \ {\n    bat_icon = \"mdi:battery-10\";\n  } else {\n    bat_icon = \"mdi:battery-outline\"\
          ;\n  }\n\n  var pv_dots = (p_pv > 5) ? `\n    <circle r=\"8\" fill=\"#25d366\"\
          \ filter=\"drop-shadow(0 0 8px #25d366)\"><animateMotion path=\"${pv_path}\"\
          \ dur=\"2s\" repeatCount=\"indefinite\" /></circle>\n    <circle r=\"8\"\
          \ fill=\"#25d366\" filter=\"drop-shadow(0 0 8px #25d366)\"><animateMotion\
          \ path=\"${pv_path}\" dur=\"2s\" begin=\"0.66s\" repeatCount=\"indefinite\"\
          \ /></circle>\n    <circle r=\"8\" fill=\"#25d366\" filter=\"drop-shadow(0\
          \ 0 8px #25d366)\"><animateMotion path=\"${pv_path}\" dur=\"2s\" begin=\"\
          1.33s\" repeatCount=\"indefinite\" /></circle>\n  ` : '';\n\n  var grid_dots\
          \ = (p_grid > 5) ? `\n    <circle r=\"8\" fill=\"#4a90e2\" filter=\"drop-shadow(0\
          \ 0 8px #4a90e2)\"><animateMotion path=\"${grid_path}\" dur=\"2s\" repeatCount=\"\
          indefinite\" /></circle>\n    <circle r=\"8\" fill=\"#4a90e2\" filter=\"\
          drop-shadow(0 0 8px #4a90e2)\"><animateMotion path=\"${grid_path}\" dur=\"\
          2s\" begin=\"0.66s\" repeatCount=\"indefinite\" /></circle>\n    <circle\
          \ r=\"8\" fill=\"#4a90e2\" filter=\"drop-shadow(0 0 8px #4a90e2)\"><animateMotion\
          \ path=\"${grid_path}\" dur=\"2s\" begin=\"1.33s\" repeatCount=\"indefinite\"\
          \ /></circle>\n  ` : '';\n\n  var load_dots = (p_load > 5) ? `\n    <circle\
          \ r=\"8\" fill=\"#ff5722\" filter=\"drop-shadow(0 0 8px #ff5722)\"><animateMotion\
          \ path=\"${load_path}\" dur=\"2s\" repeatCount=\"indefinite\" /></circle>\n\
          \    <circle r=\"8\" fill=\"#ff5722\" filter=\"drop-shadow(0 0 8px #ff5722)\"\
          ><animateMotion path=\"${load_path}\" dur=\"2s\" begin=\"0.66s\" repeatCount=\"\
          indefinite\" /></circle>\n    <circle r=\"8\" fill=\"#ff5722\" filter=\"\
          drop-shadow(0 0 8px #ff5722)\"><animateMotion path=\"${load_path}\" dur=\"\
          2s\" begin=\"1.33s\" repeatCount=\"indefinite\" /></circle>\n  ` : '';\n\
          \n  var bat_dots = (Math.abs(bat_num) > 5) ? `\n    <circle r=\"8\" fill=\"\
          #bc52ff\" filter=\"drop-shadow(0 0 8px #bc52ff)\"><animateMotion path=\"\
          ${bat_path}\" dur=\"2s\" repeatCount=\"indefinite\" /></circle>\n    <circle\
          \ r=\"8\" fill=\"#bc52ff\" filter=\"drop-shadow(0 0 8px #bc52ff)\"><animateMotion\
          \ path=\"${bat_path}\" dur=\"2s\" begin=\"0.66s\" repeatCount=\"indefinite\"\
          \ /></circle>\n    <circle r=\"8\" fill=\"#bc52ff\" filter=\"drop-shadow(0\
          \ 0 8px #bc52ff)\"><animateMotion path=\"${bat_path}\" dur=\"2s\" begin=\"\
          1.33s\" repeatCount=\"indefinite\" /></circle>\n  ` : '';\n\n  return `\n\
          \    <style>\n      @keyframes flow-dash { 0% { stroke-dashoffset: 20; }\
          \ 100% { stroke-dashoffset: 0; } }\n      .active-flow { animation: flow-dash\
          \ 1s linear infinite; }\n    </style>\n\n    <div style=\"display: flex;\
          \ flex-direction: column; justify-content: space-between; height: 100%;\
          \ width: 100%; box-sizing: border-box;\">\n      <div style=\"display: flex;\
          \ justify-content: space-between; align-items: center; margin-bottom: 6px;\
          \ width: 100%;\">\n        <div style=\"font-size: 13px; font-weight: 800;\
          \ color: #fff; letter-spacing: 0.3px; white-space: nowrap;\">DÒNG NĂNG LƯỢNG</div>\n\
          \        <div style=\"background: rgba(37,211,102,0.12); border: 1px solid\
          \ rgba(37,211,102,0.3); padding: 3px 8px; border-radius: 12px; font-size:\
          \ 10px; color: #25d366; font-weight: 700; display: flex; align-items: center;\
          \ gap: 4px; white-space: nowrap;\">\n          <span style=\"height: 5px;\
          \ width: 5px; background-color: #25d366; border-radius: 50%; box-shadow:\
          \ 0 0 5px #25d366;\"></span> \n          <span id=\"live-clock-pad\">${now}</span>\n\
          \        </div>\n      </div>\n\n      <!-- ĐỒNG HỒ NHẢY TỪNG GIÂY -->\n\
          \      <img src=\"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7\"\
          \ style=\"display:none;\" onload=\"\n        if (!window.liveClockPadInterval)\
          \ {\n          window.liveClockPadInterval = setInterval(function() {\n\
          \            var els = document.querySelectorAll('#live-clock-pad');\n \
          \           var t = new Date().toLocaleTimeString('vi-VN', { hour12: false\
          \ });\n            els.forEach(function(el) { el.innerText = t; });\n  \
          \        }, 1000);\n        }\n      \" />\n\n      <div style=\"position:\
          \ relative; flex: 1; min-height: 270px; width: 100%; display: grid; grid-template-columns:\
          \ 1fr auto 1fr; align-items: center; gap: 6px;\">\n        \n        <svg\
          \ viewBox=\"0 0 1000 500\" preserveAspectRatio=\"none\" style=\"position:\
          \ absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events:\
          \ none; z-index: 1;\">\n          <defs>\n            <marker id=\"arr-green\"\
          \ viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"6\" markerHeight=\"\
          6\" orient=\"auto\">\n              <path d=\"M 0 1.5 L 8 5 L 0 8.5 z\"\
          \ fill=\"#25d366\"/>\n            </marker>\n            <marker id=\"arr-purple\"\
          \ viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"6\" markerHeight=\"\
          6\" orient=\"auto\">\n              <path d=\"M 0 1.5 L 8 5 L 0 8.5 z\"\
          \ fill=\"#bc52ff\"/>\n            </marker>\n            <marker id=\"arr-blue\"\
          \ viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"6\" markerHeight=\"\
          6\" orient=\"auto\">\n              <path d=\"M 0 1.5 L 8 5 L 0 8.5 z\"\
          \ fill=\"#4a90e2\"/>\n            </marker>\n            <marker id=\"arr-orange\"\
          \ viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"6\" markerHeight=\"\
          6\" orient=\"auto\">\n              <path d=\"M 0 1.5 L 8 5 L 0 8.5 z\"\
          \ fill=\"#ff5722\"/>\n            </marker>\n          </defs>\n\n     \
          \     <path d=\"${pv_path}\" stroke=\"#25d366\" stroke-width=\"2.5\" stroke-linejoin=\"\
          round\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\" fill=\"\
          none\" stroke-dasharray=\"6,6\" marker-end=\"url(#arr-green)\" class=\"\
          ${p_pv > 5 ? 'active-flow' : ''}\" />\n          <path d=\"${bat_path}\"\
          \ stroke=\"#bc52ff\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"\
          round\" vector-effect=\"non-scaling-stroke\" fill=\"none\" stroke-dasharray=\"\
          6,6\" marker-end=\"url(#arr-purple)\" class=\"${Math.abs(bat_num) > 5 ?\
          \ 'active-flow' : ''}\" />\n          <path d=\"${grid_path}\" stroke=\"\
          #4a90e2\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"\
          round\" vector-effect=\"non-scaling-stroke\" fill=\"none\" stroke-dasharray=\"\
          6,6\" marker-end=\"url(#arr-blue)\" class=\"${p_grid > 5 ? 'active-flow'\
          \ : ''}\" />\n          <path d=\"${load_path}\" stroke=\"#ff5722\" stroke-width=\"\
          2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\" vector-effect=\"\
          non-scaling-stroke\" fill=\"none\" stroke-dasharray=\"6,6\" marker-end=\"\
          url(#arr-orange)\" class=\"${p_load > 5 ? 'active-flow' : ''}\" />\n\n \
          \         ${pv_dots}\n          ${bat_dots}\n          ${grid_dots}\n  \
          \        ${load_dots}\n        </svg>\n\n        <!-- CỘT 1 (TRÁI): PV &\
          \ PIN -->\n        <div style=\"display: flex; flex-direction: column; justify-content:\
          \ space-between; height: 100%; z-index: 2; padding: 12px 0;\">\n       \
          \   <div style=\"display: flex; align-items: center; gap: 6px;\">\n    \
          \        <ha-icon icon=\"mdi:solar-power\" style=\"--mdc-icon-size: 28px;\
          \ color: #25d366;\"></ha-icon>\n            <div>\n              <div style=\"\
          font-size: 10px; color: #888;\">PV</div>\n              <div style=\"font-size:\
          \ 13px; font-weight: 800; color: #25d366; line-height: 1.1;\">${p_pv} <span\
          \ style=\"font-size: 9px; color: #888;\">W</span></div>\n            </div>\n\
          \          </div>\n          <div style=\"display: flex; align-items: center;\
          \ gap: 6px;\">\n            <ha-icon icon=\"${bat_icon}\" style=\"--mdc-icon-size:\
          \ 28px; color: #bc52ff;\"></ha-icon>\n            <div>\n              <div\
          \ style=\"font-size: 10px; color: #bc52ff; font-weight: 800;\">${soc}%</div>\n\
          \              <div style=\"font-size: 12px; font-weight: 800; color: #fff;\
          \ line-height: 1.1;\">${b_power} <span style=\"font-size: 9px; color: #aaa;\"\
          >W</span></div>\n              <div style=\"font-size: 9px; color: #aaa;\"\
          >${b_volt} V</div>\n            </div>\n          </div>\n        </div>\n\
          \n        <!-- CỘT 2 (GIỮA): LUXPOWER SNA PRO 6.5KW MÔ HÌNH 3D -->\n   \
          \     <div style=\"display: flex; flex-direction: column; justify-content:\
          \ center; align-items: center; z-index: 2; position: relative;\">\n    \
          \      <div style=\"position: relative; width: 88px; height: 124px; background:\
          \ linear-gradient(160deg, #ffffff 0%, #f0f2f5 70%, #dce0e6 100%); border-radius:\
          \ 11px; border: 1px solid #dcdfe6; box-shadow: 0 10px 24px rgba(0,0,0,0.7);\
          \ display: flex; flex-direction: column; align-items: center; justify-content:\
          \ space-between; padding: 6px 4px 4px 4px; box-sizing: border-box; margin-top:\
          \ 10px;\">\n            \n            <div style=\"position: absolute; top:\
          \ -22px; display: flex; align-items: center; gap: 3px; font-size: 8.5px;\
          \ font-weight: 800; color: ${wifi_color}; background: rgba(0,0,0,0.7); padding:\
          \ 2px 6px; border-radius: 8px; border: 1px solid ${wifi_color}; white-space:\
          \ nowrap;\">\n              <ha-icon icon=\"${wifi_icon}\" style=\"--mdc-icon-size:\
          \ 10px; color: ${wifi_color};\"></ha-icon>\n              <span>${wifi_text}</span>\n\
          \            </div>\n\n            <div style=\"width: 100%; display: flex;\
          \ align-items: center; justify-content: flex-start; padding-left: 3px;\"\
          >\n              <span style=\"font-size: 7px; font-weight: 900; color:\
          \ #1a252c;\">LUX<span style=\"color: #25d366;\">⚡</span>POWER</span>\n \
          \           </div>\n\n            <div style=\"width: 64px; height: 42px;\
          \ background: #080d14; border-radius: 5px; border: 1px solid #222; padding:\
          \ 3px; display: flex; flex-direction: column; justify-content: space-between;\
          \ align-items: center;\">\n              <span style=\"font-size: 7.5px;\
          \ color: #4a90e2; font-weight: 800;\">SNA 6.5KW</span>\n              <div\
          \ style=\"font-size: 11px; font-weight: 800; color: #00ffcc; display: flex;\
          \ align-items: center; gap: 2px;\">\n                <ha-icon icon=\"mdi:thermometer\"\
          \ style=\"--mdc-icon-size: 11px; color: #00ffcc;\"></ha-icon>\n        \
          \        <span>${inv_temp}°C</span>\n              </div>\n            \
          \  <div style=\"display: flex; gap: 4px;\">\n                <span style=\"\
          height: 2px; width: 6px; background: #25d366;\"></span>\n              \
          \  <span style=\"height: 2px; width: 6px; background: #4a90e2;\"></span>\n\
          \                <span style=\"height: 2px; width: 6px; background: #ff5722;\"\
          ></span>\n              </div>\n            </div>\n\n            <div style=\"\
          width: 100%; height: 20px; background: #f8f9fa; border-radius: 4px; border:\
          \ 1px solid #e2e8f0; display: flex; justify-content: center; align-items:\
          \ center;\">\n              <span style=\"font-size: 6.5px; font-weight:\
          \ 900; color: #475569;\">SNA PRO</span>\n            </div>\n\n        \
          \    <div style=\"position: absolute; bottom: -6px; display: flex; gap:\
          \ 4px; z-index: -1;\">\n              <span style=\"width: 5px; height:\
          \ 7px; background: #334155; border-radius: 0 0 2px 2px;\"></span>\n    \
          \          <span style=\"width: 5px; height: 7px; background: #334155; border-radius:\
          \ 0 0 2px 2px;\"></span>\n              <span style=\"width: 6px; height:\
          \ 7px; background: #dc2626; border-radius: 0 0 2px 2px;\"></span>\n    \
          \          <span style=\"width: 5px; height: 7px; background: #334155; border-radius:\
          \ 0 0 2px 2px;\"></span>\n              <span style=\"width: 5px; height:\
          \ 7px; background: #334155; border-radius: 0 0 2px 2px;\"></span>\n    \
          \        </div>\n          </div>\n        </div>\n\n        <!-- CỘT 3\
          \ (PHẢI): LƯỚI ĐIỆN & TẢI NHÀ -->\n        <div style=\"display: flex; flex-direction:\
          \ column; justify-content: space-between; height: 100%; text-align: right;\
          \ z-index: 2; padding: 12px 0;\">\n          <div style=\"display: flex;\
          \ align-items: center; justify-content: flex-end; gap: 6px;\">\n       \
          \     <div>\n              <div style=\"font-size: 10px; color: #888;\"\
          >Lưới điện</div>\n              <div style=\"font-size: 13px; font-weight:\
          \ 800; color: #4a90e2; line-height: 1.1;\">${p_grid} <span style=\"font-size:\
          \ 9px; color: #888;\">W</span></div>\n            </div>\n            <ha-icon\
          \ icon=\"mdi:transmission-tower\" style=\"--mdc-icon-size: 28px; color:\
          \ #4a90e2;\"></ha-icon>\n          </div>\n          <div style=\"display:\
          \ flex; align-items: center; justify-content: flex-end; gap: 6px;\">\n \
          \           <div>\n              <div style=\"font-size: 10px; color: #888;\"\
          >Tiêu thụ</div>\n              <div style=\"font-size: 13px; font-weight:\
          \ 800; color: #ff5722; line-height: 1.1;\">${p_load} <span style=\"font-size:\
          \ 9px; color: #888;\">W</span></div>\n            </div>\n            <ha-icon\
          \ icon=\"mdi:home\" style=\"--mdc-icon-size: 30px; color: #ff5722;\"></ha-icon>\n\
          \          </div>\n        </div>\n\n      </div>\n    </div>\n  `;\n]]]\n"
